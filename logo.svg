<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Satmeter">
  <title>Satmeter</title>
  <defs><clipPath id="sq"><rect width="512" height="512" rx="104"/></clipPath></defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="#0a0c12"/>

    <!-- the bolt: what pays for it -->
